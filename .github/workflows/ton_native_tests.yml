name: Ton Native Tests

on:
  push:
    branches: [dev]
    paths:
      - 'chains/ton/contracts/train.tact'
      - 'chains/ton/tests/train.spec.ts'
  pull_request:
    branches: [dev]
    paths:
      - 'chains/ton/contracts/train.tact'
      - 'chains/ton/tests/train.spec.ts'

jobs:
  blueprint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        working-directory: chains/ton
        run: npm install

      - name: Build train contract
        working-directory: chains/ton/contracts
        run: npx blueprint build train

      - name: Run blueprint tests
        id: blueprint_test
        working-directory: chains/ton
        run: |
          npx blueprint test tests/train.spec.ts | tee blueprint-test.log
        continue-on-error: true

      - name: Fail with custom message if tests failed
        if: steps.blueprint_test.conclusion == 'failure'
        working-directory: chains/ton
        run: |
          echo "❌ Blueprint tests failed! Last 50 lines of output:"
          tail -n 50 blueprint-test.log || true
          exit 1
