name: Ton Native Tests

on:
  push:
    branches: [ dev ]
    paths:
      - 'chains/ton/contracts/train.tact'
      - 'chains/ton/tests/**'
  pull_request:
    branches: [ dev ]
    paths:
      - 'chains/ton/contracts/train.tact'
      - 'chains/ton/tests/**'

jobs:
  blueprint-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      working-directory: chains/ton
      run: npm install

    - name: Install Blueprint CLI globally
      run: npm install -g @ton-community/blueprint

    - name: Build train contract
      working-directory: chains/ton/contracts
      run: npx blueprint build train

    - name: Run blueprint tests
      working-directory: chains/ton
      run: npx blueprint test tests/train.spec.ts
